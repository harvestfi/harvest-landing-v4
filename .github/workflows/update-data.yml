name: Update Vault Data

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write


jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      # Always pin to main, regardless of which branch the repo's default
      # is currently set to. Without this, schedule events were checking
      # out a stale dev branch and the data refresh never landed on the
      # branch Vercel deploys from.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch data from APIs
        run: node scripts/fetch-data.mjs

      - name: Fetch holder counts (Blockscout)
        run: node scripts/fetch-holders.mjs
        continue-on-error: true

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vaults.json data/history.json data/slugs.json
          if [ -f data/studio-vaults.json ]; then git add data/studio-vaults.json; fi
          if [ -f data/holders.json ]; then git add data/holders.json; fi
          if [ -f data/hidden.json ]; then git add data/hidden.json; fi
          if git diff --cached --quiet; then
            echo "No data changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update vault data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Race-safe push: if another commit landed on main between
          # checkout and push, rebase onto it and try once more.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected on attempt $attempt, rebasing on origin/main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after retries."
          exit 1

      # Ping IndexNow (Bing/Yandex/Seznam/Naver/...) when product pages were
      # added or removed, so they recrawl fast. No secret needed — auth is the
      # public /<key>.txt file. Gated on a repo VARIABLE so it stays off on
      # forks/staging (whose host wouldn't match) and is opt-in on prod:
      # set repository variable INDEXNOW_ENABLED=true to turn it on.
      # The submitter is incremental (diffs data/slugs.json HEAD^..HEAD) and
      # exits quietly when only APY/TVL changed, so it never over-submits.
      - name: Notify IndexNow of changed URLs
        if: steps.commit.outputs.changed == 'true' && vars.INDEXNOW_ENABLED == 'true'
        run: node scripts/indexnow-submit.mjs
