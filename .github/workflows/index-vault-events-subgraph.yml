name: Index Vault Events (Subgraph)

# Subgraph-driven companion to the RPC indexer. Pulls deposit /
# withdraw rows from the Harvest subgraph (one endpoint per chain,
# {chainId} substituted at the URL placeholder) and upserts them
# into vault_events_prod.
#
# SCHEDULE DISABLED - run manually via the Actions "Run workflow" button.
#
# Indexes ALL networks (Ethereum, Base, Arbitrum, Polygon, zkSync,
# HyperEVM) in one job. The script keeps only the real-user leg
# (userAddress, not the zero-address mint/burn counterpart) and writes a
# USD value per row into vault_events_prod.amount_usd. The Deposit Activity
# page reads exactly those rows (amount_usd IS NOT NULL), so subgraph rows
# never double-count against the RPC indexer's rows (which leave amount_usd
# null) even while both run. Each chain backfills BACKFILL_DAYS on its first
# run, then resumes from the latest subgraph row it wrote.
#
# PREREQUISITE: vault_events_prod must have amount_usd + amount_token cols:
#   ALTER TABLE vault_events_prod ADD COLUMN IF NOT EXISTS amount_usd numeric;
#   ALTER TABLE vault_events_prod ADD COLUMN IF NOT EXISTS amount_token numeric;
#
# Pass --chain=<Name> to limit to a single network when debugging.

on:
  # Hourly ongoing fill. The indexer is incremental but re-sweeps a multi-day
  # window each run (RESCAN_DAYS, default 7) so events the hosted subgraph
  # indexes late / out of order are still caught - a 60s guard used to orphan
  # them. Cheap to run often (dedup makes re-seen rows free). The Deposit
  # Activity / Wallet History pages read only amount_usd IS NOT NULL, so this
  # stays isolated from the RPC indexer.
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      rescan_days:
        description: "Re-scan window in days (use a large value e.g. 730 once to close old gaps)"
        required: false
        default: "7"

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Index user transactions from subgraph
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Manual runs can pass a larger window (e.g. 730) to close old gaps;
          # scheduled runs fall back to the script default (7).
          RESCAN_DAYS: ${{ github.event.inputs.rescan_days }}
        run: node scripts/index-vault-events-subgraph.mjs
