name: Index Vault Events (Subgraph)

# Subgraph-driven companion to the RPC indexer. Pulls deposit /
# withdraw rows from the Harvest subgraph (one endpoint per chain,
# {chainId} substituted at the URL placeholder) and upserts them
# into vault_events_prod.
#
# SCHEDULE DISABLED - run manually via the Actions "Run workflow" button.
#
# Scoped to Base while we validate the subgraph source against the RPC
# indexer. The script keeps only the real-user leg (userAddress, not the
# zero-address mint/burn counterpart) and writes a USD value per row into
# vault_events_prod.amount_usd. The Deposit Activity page reads exactly
# those rows (chain=Base AND amount_usd IS NOT NULL), so subgraph rows
# never double-count against the RPC indexer's rows (which leave
# amount_usd null) even while both run.
#
# PREREQUISITE: vault_events_prod must have an `amount_usd` column:
#   ALTER TABLE vault_events_prod ADD COLUMN IF NOT EXISTS amount_usd numeric;
#
# Once Base is validated, widen with --chain or drop the flag to index
# all chains, and scope the RPC indexer off Base to avoid duplicate rows.

on:
  # schedule:
  #   - cron: '15 * * * *'
  workflow_dispatch: {}

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Index user transactions from subgraph
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/index-vault-events-subgraph.mjs --chain=Base
